name: Knowledge Map — Auto-Rebuild

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "graphify-out/**"
      - ".github/workflows/**"
      - "wiki/.obsidian/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install graphifyy networkx -q

      - name: Rebuild map
        run: python3 scripts/update_map.py

      - name: Commit & push
        run: |
          git config user.name  "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add graphify-out/
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "chore: update knowledge map [skip ci]"
          git push origin HEAD || true
